name: Claude

# @claude on PRs and issues, owner only. The steps live in thelankankid/ci (claude.yml).
# Needs the Claude GitHub App on this repo and the secret CLAUDE_CODE_OAUTH_TOKEN.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    uses: thelankankid/ci/.github/workflows/claude.yml@SHA # v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
